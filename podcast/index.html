<script>
(function() {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var index = null;

  function loadIndex(cb) {
    if (index) { cb(); return; }
    fetch('/search.json').then(function(r) { return r.json(); }).then(function(data) {
      index = data;
      cb();
    });
  }

  function search(q) {
    q = q.toLowerCase().trim();
    if (!q) { results.classList.remove('active'); return; }
    var matches = index.filter(function(p) {
      return p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q);
    }).slice(0, 8);

    if (matches.length === 0) {
      results.innerHTML = '<div class="search-no-results">No results for "' + q + '"</div>';
    } else {
      results.innerHTML = matches.map(function(p) {
        return '<a class="search-result-item" href="/blog/' + p.slug + '/">' +
          '<div class="search-result-title">' + p.title + '</div>' +
          '<div class="search-result-date">' + p.date + '</div>' +
          '</a>';
      }).join('');
    }
    results.classList.add('active');
  }

  input.addEventListener('focus', function() {
    loadIndex(function() { if (input.value) search(input.value); });
  });
  input.addEventListener('input', function() {
    loadIndex(function() { search(input.value); });
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrap')) results.classList.remove('active');
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { results.classList.remove('active'); input.blur(); }
  });
})();
</script>

<script>
(function(){
  var popup=null,timer=null;
  function mkPopup(){
    if(popup) return popup;
    popup=document.createElement('div');
    popup.className='ticker-popup';
    document.body.appendChild(popup);
    popup.addEventListener('mouseenter',function(){clearTimeout(timer);});
    popup.addEventListener('mouseleave',hide);
    return popup;
  }
  function show(el){
    clearTimeout(timer);
    var t=el.dataset.ticker;
    var p=mkPopup();
    if(p.dataset.ticker!==t){
      p.dataset.ticker=t;
      var src='https://www.tradingview.com/widgetembed/?symbol='+encodeURIComponent(t)
        +'&interval=W&hidesidetoolbar=1&hidetoptoolbar=1&theme=light&style=2&locale=en'
        +'&allow_symbol_change=0&save_image=0&withdateranges=0';
      p.innerHTML='<iframe src="'+src+'" width="380" height="230" frameborder="0" scrolling="no"></iframe>';
    }
    var r=el.getBoundingClientRect(),pw=380,ph=230,gap=10;
    var left=r.left+r.width/2-pw/2;
    var top=r.top-ph-gap;
    if(top<gap) top=r.bottom+gap;
    if(left<gap) left=gap;
    if(left+pw>window.innerWidth-gap) left=window.innerWidth-pw-gap;
    p.style.left=left+'px';
    p.style.top=top+'px';
    p.classList.add('visible');
  }
  function hide(){
    timer=setTimeout(function(){if(popup)popup.classList.remove('visible');},200);
  }
  document.querySelectorAll('.ticker-hover').forEach(function(el){
    el.addEventListener('mouseenter',function(){show(el);});
    el.addEventListener('mouseleave',hide);
  });
})();
</script>
