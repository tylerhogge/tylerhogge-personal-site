  <script>
    (function(){
      var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

    })();
  </script>

<body>
<nav>
  <div class="nav-inner">
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
<li><a href="/blog/">Writing</a></li>
<li><a href="/investments/">Investments</a></li>
<li><a href="/quotes/">Quotes</a></li>
<li><a href="https://www.investoroperator.io/" target="_blank" rel="noopener">Podcast</a></li>
    </ul>
    <div class="search-wrap">
      <input class="search-input" type="search" placeholder="Search…" id="search-input" autocomplete="off" aria-label="Search posts">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
</nav>
<script>
(function() {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var index = null;

  function loadIndex(cb) {
    if (index) { cb(); return; }
    fetch('/search.json').then(function(r) { return r.json(); }).then(function(data) {
      index = data;
      cb();
    });
  }

  function search(q) {
    q = q.toLowerCase().trim();
    if (!q) { results.classList.remove('active'); return; }
    var matches = index.filter(function(p) {
      return p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q);
    }).slice(0, 8);

    if (matches.length === 0) {
      results.innerHTML = '<div class="search-no-results">No results for "' + q + '"</div>';
    } else {
      results.innerHTML = matches.map(function(p) {
        return '<a class="search-result-item" href="/blog/' + p.slug + '/">' +
          '<div class="search-result-title">' + p.title + '</div>' +
          '<div class="search-result-date">' + p.date + '</div>' +
          '</a>';
      }).join('');
    }
    results.classList.add('active');
  }

  input.addEventListener('focus', function() {
    loadIndex(function() { if (input.value) search(input.value); });
  });
  input.addEventListener('input', function() {
    loadIndex(function() { search(input.value); });
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-wrap')) results.classList.remove('active');
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { results.classList.remove('active'); input.blur(); }
  });
})();
</script>
<main>

<div class="page-header"><h1><a href="https://www.investoroperator.io/" target="_blank" rel="noopener">Podcast</a></h1></div>
<div class="page-body">
  <p>The <a href="https://www.investoroperator.io/" target="_blank" rel="noopener">IO Podcast</a> — a monthly conversation with the world's best investors and operators.</p>
</div>

</main>
<footer>
  <p>
    <a href="https://x.com/thogge" target="_blank" rel="noopener">@thogge</a> ·
    <a href="mailto:tylerhogge@gmail.com">Email</a>
  </p>
</footer>
<button id="theme-toggle" title="Toggle dark/light mode"></button>
<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  var html = document.documentElement;
  function apply(dark) {
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.textContent = dark ? '☀ Light' : '◑ Dark';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  var stored = localStorage.getItem('theme');
  var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(dark);
  btn.addEventListener('click', function() { apply(!html.getAttribute('data-theme').includes('dark')); });
})();
</script>
</body>
</html>
